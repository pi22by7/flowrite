name: Validate all platforms

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Use sample configuration for validation
        run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  builds:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
            command: flutter build web --release --no-pub
          - platform: android
            os: ubuntu-latest
            command: flutter build apk --debug --no-pub
          - platform: linux
            os: ubuntu-latest
            command: flutter build linux --release --no-pub
          - platform: ios
            os: macos-latest
            command: flutter build ios --simulator --debug --no-pub
          - platform: macos
            os: macos-latest
            command: flutter build macos --release --no-pub
          - platform: windows
            os: windows-latest
            command: flutter build windows --release --no-pub
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Set up Android SDK
        if: matrix.platform == 'android'
        uses: android-actions/setup-android@v3
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Use sample configuration for validation
        shell: bash
        run: cp .env.example .env
      - run: flutter pub get
      - name: Compile application
        run: ${{ matrix.command }}
