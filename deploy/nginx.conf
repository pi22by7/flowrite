upstream flowrite_webdav {
    zone flowrite_webdav 64k;
    server webdav:80 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    # Keep DAV on the app's origin; no cross-origin credential setup is needed.
    location ^~ /dav/ {
        proxy_pass http://flowrite_webdav/;
        proxy_hide_header Cache-Control;
        add_header Cache-Control 'no-store' always;
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
    location = /healthz { access_log off; return 200 'ok'; }
    location = /service-worker.js {
        add_header Cache-Control 'no-cache';
        try_files $uri =404;
    }
    location ~* \.(js|wasm|json|ttf|woff2?|png|ico|dict|bin)$ {
        add_header Cache-Control 'no-cache';
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
